<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 수정 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        
        /* 토글 스위치 디자인 */
        .toggle-checkbox:checked { right: 0; border-color: #B69A7B; }
        .toggle-checkbox:checked + .toggle-label { background-color: #B69A7B; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #cbd5e1; transition: all 0.3s; border-radius: 9999px; }
        
        /* 에디터 툴바 버튼 */
        .toolbar-btn { padding: 4px 8px; font-size: 13px; color: #555; border-radius: 4px; transition: background 0.2s; cursor: pointer; }
        .toolbar-btn:hover { background-color: #e2e8f0; }
        .toolbar-btn.active { background-color: #FDFCF0; color: #B69A7B; font-weight: bold; border: 1px solid #EBE7D9; }
        
        /* 에디터 내부 기본 스타일 지정 */
        #editor { outline: none; }
        #editor ul { list-style-type: disc; margin-left: 20px; padding-left: 20px; margin-bottom: 10px; }
        #editor ol { list-style-type: decimal; margin-left: 20px; padding-left: 20px; margin-bottom: 10px; }
        #editor blockquote { border-left: 4px solid #B69A7B; padding-left: 15px; color: #555; background: #fdfcf0; padding-top: 10px; padding-bottom: 10px; margin-bottom: 10px; font-style: italic; }
        #editor h2 { font-size: 1.5em; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
        #editor h3 { font-size: 1.17em; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
        #editor a { color: #3b82f6; text-decoration: underline; }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-5xl mx-auto py-12 px-6">
        <!-- 헤더 -->
        <div class="mb-10 border-b border-gray-200 pb-6">
            <span class="text-xs font-bold text-[#B69A7B] tracking-widest uppercase">Edit Column</span>
            <h1 class="text-3xl font-bold mt-2">칼럼 수정</h1>
        </div>

        <form id="editForm" class="space-y-8">
            <!-- 제목 -->
            <div>
                <label for="title" class="block text-sm font-bold text-gray-700 mb-2">제목</label>
                <input type="text" id="title" required placeholder="칼럼 제목을 입력하세요" 
                       class="w-full border border-gray-300 rounded-md p-4 text-lg focus:outline-none focus:border-[#B69A7B] focus:ring-1 focus:ring-[#B69A7B]">
            </div>

            <!-- URL 주소 (슬러그) -->
            <div>
                <label for="slug" class="block text-sm font-bold text-gray-700 mb-2">URL 주소 (슬러그)</label>
                <input type="text" id="slug" placeholder="예: online-marketing (영문, 숫자, 하이픈만 사용 권장)" 
                       class="w-full border border-gray-300 rounded-md p-4 text-lg text-gray-600 focus:outline-none focus:border-[#B69A7B] focus:ring-1 focus:ring-[#B69A7B]">
                <p class="text-xs text-gray-500 mt-2">* 입력
