<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>칼럼 수정 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        
        /* 토글 스위치 디자인 */
        .toggle-checkbox:checked { right: 0; border-color: #B69A7B; }
        .toggle-checkbox:checked + .toggle-label { background-color: #B69A7B; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { width: 3rem; height: 1.5rem; background-color: #cbd5e1; transition: all 0.3s; border-radius: 9999px; }
        
        /* 에디터 툴바 버튼 */
        .toolbar-btn { padding: 4px 8px; font-size: 13px; color: #555; border-radius: 4px; transition: background 0.2s; cursor: pointer; }
        .toolbar-btn:hover { background-color: #e2e8f0; }
        .toolbar-btn.active { background-color: #FDFCF0; color: #B69A7B; font-weight: bold; border: 1px solid #EBE7D9; }
        
        /* 에디터 내부 기본 스타일 지정 */
        #editor { outline: none; }
        #editor ul { list-style-type: disc; margin-left: 20px; padding-left: 20px; margin-bottom: 10px; }
        #editor ol { list-style-type: decimal; margin-left: 20px; padding-left: 20px; margin-bottom: 10px; }
        #editor blockquote { border-left: 4px solid #B69A7B; padding-left: 15px; color: #555; background: #fdfcf0; padding-top: 10px; padding-bottom: 10px; margin-bottom: 10px; font-style: italic; }
        #editor h2 { font-size: 1.5em; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
        #editor h3 { font-size: 1.17em; font-weight: bold; margin-top: 15px; margin-bottom: 10px; }
        #editor a { color: #3b82f6; text-decoration: underline; }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-5xl mx-auto py-12 px-6">
        <!-- 헤더 -->
        <div class="mb-10 border-b border-gray-200 pb-6">
            <span class="text-xs font-bold text-[#B69A7B] tracking-widest uppercase">Edit Column</span>
            <h1 class="text-3xl font-bold mt-2">칼럼 수정</h1>
        </div>

        <form id="editForm" class="space-y-8">
            <!-- 제목 -->
            <div>
                <label for="title" class="block text-sm font-bold text-gray-700 mb-2">제목</label>
                <input type="text" id="title" required placeholder="칼럼 제목을 입력하세요" 
                       class="w-full border border-gray-300 rounded-md p-4 text-lg focus:outline-none focus:border-[#B69A7B] focus:ring-1 focus:ring-[#B69A7B]">
            </div>

            <!-- URL 주소 (슬러그) -->
            <div>
                <label for="slug" class="block text-sm font-bold text-gray-700 mb-2">URL 주소 (슬러그)</label>
                <input type="text" id="slug" placeholder="예: online-marketing (영문, 숫자, 하이픈만 사용 권장)" 
                       class="w-full border border-gray-300 rounded-md p-4 text-lg text-gray-600 focus:outline-none focus:border-[#B69A7B] focus:ring-1 focus:ring-[#B69A7B]">
                <p class="text-xs text-gray-500 mt-2">* 입력하지 않으면 제목이 자동으로 URL이 됩니다. 한글 제목은 주소가 길어질 수 있으므로 짧은 영문 입력을 권장합니다.</p>
            </div>

            <!-- 카테고리 & 공개 여부 -->
            <div class="flex items-center gap-8">
                <div>
                    <label for="category" class="block text-sm font-bold text-gray-700 mb-2">카테고리</label>
                    <select id="category" required class="border border-gray-300 rounded-md p-3 pr-10 focus:outline-none focus:border-[#B69A7B] bg-white w-48">
                        <option value="">카테고리 선택</option>
                        <option value="spine">척추/관절</option>
                        <option value="tinnitus">이명/난청</option>
                        <option value="diet">여성/다이어트</option>
                        <option value="traffic">교통사고</option>
                    </select>
                </div>

                <div class="pt-6 flex items-center">
                    <div class="relative inline-block w-12 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="is_published" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="is_published" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-300 cursor-pointer"></label>
                    </div>
                    <label for="is_published" class="text-sm font-medium text-gray-700 cursor-pointer">홈페이지에 공개</label>
                </div>
            </div>

            <!-- 대표 이미지 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">대표 이미지 <span class="text-xs font-normal text-gray-400">목록 썸네일 · 선택</span></label>
                <div class="flex items-center border border-gray-300 rounded-md p-2 bg-white">
                    <button type="button" class="bg-[#2c2c2c] text-white px-4 py-2 rounded text-sm hover:bg-black transition">파일 선택</button>
                    <span class="ml-4 text-sm text-gray-500">선택된 파일 없음</span>
                </div>
                <p class="text-xs text-gray-500 mt-2">비워두면 본문 첫 번째 사진이 자동으로 대표 이미지가 됩니다.</p>
            </div>

            <!-- 본문 에디터 -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">본문</label>
                <div class="border border-gray-300 rounded-t-md bg-[#f4f4f4] p-2 flex flex-wrap items-center gap-1 border-b-0">
                    <button type="button" onclick="formatText('bold')" class="toolbar-btn font-bold">B</button>
                    <button type="button" onclick="formatText('italic')" class="toolbar-btn italic">I</button>
                    <button type="button" onclick="formatText('underline')" class="toolbar-btn underline">U</button>
                    <div class="w-px h-4 bg-gray-300 mx-2"></div>
                    <button type="button" onclick="formatText('formatBlock', 'H2')" class="toolbar-btn font-bold">H2</button>
                    <button type="button" onclick="formatText('formatBlock', 'H3')" class="toolbar-btn font-bold">H3</button>
                    <div class="w-px h-4 bg-gray-300 mx-2"></div>
                    <button type="button" onclick="formatText('insertUnorderedList')" class="toolbar-btn">· 목록</button>
                    <button type="button" onclick="formatText('insertOrderedList')" class="toolbar-btn">1. 목록</button>
                    <button type="button" onclick="formatText('formatBlock', 'BLOCKQUOTE')" class="toolbar-btn">" 인용</button>
                    <button type="button" onclick="insertLink()" class="toolbar-btn"><i class="fa-solid fa-link text-xs"></i> 링크</button>
                    
                    <!-- 파일 탐색기 연결용 숨겨진 input과 사진 버튼 -->
                    <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="uploadImage(this)">
                    <button type="button" onclick="document.getElementById('imageInput').click()" class="toolbar-btn active flex items-center gap-1"><i class="fa-regular fa-image"></i> 사진</button>
                </div>
                
                <div id="editor" contenteditable="true" 
                     class="w-full border border-gray-300 rounded-b-md p-6 min-h-[400px] focus:outline-none focus:border-[#B69A7B] text-gray-700 leading-relaxed bg-white overflow-y-auto">
                </div>
                <input type="hidden" id="content">
            </div>

            <!-- 버튼 영역 -->
            <div class="flex justify-end gap-3 pt-6 border-t border-gray-200">
                <button type="button" onclick="history.back()" class="px-8 py-3 bg-gray-200 text-gray-700 font-bold rounded-md hover:bg-gray-300 transition">
                    취소
                </button>
                <button type="submit" class="px-8 py-3 bg-[#B69A7B] text-white font-bold rounded-md hover:bg-[#9A7D5E] transition shadow-md">
                    수정 완료
                </button>
            </div>
        </form>
    </div>

    <script>
        function formatText(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editor').focus();
        }

        function insertLink() {
            const url = prompt('연결할 링크 주소(URL)를 입력하세요:', 'https://');
            if (url) {
                formatText('createLink', url);
            }
        }

        // --- 글 작성 중 커서 위치에 사진이 바로 들어가는 Base64 방식 ---
        function uploadImage(inputElement) {
            const file = inputElement.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const imageUrl = e.target.result; 
                
                // 1. 에디터 본문을 클릭한 것처럼 포커스 주기
                document.getElementById('editor').focus();
                
                // 2. 현재 글을 쓰고 있던 커서 위치에 정확히 사진 삽입
                document.execCommand('insertImage', false, imageUrl);
                
                // 3. 사진 크기 및 여백 스타일 자동 적용
                const editor = document.getElementById('editor');
                const images = editor.getElementsByTagName('img');
                for(let i = 0; i < images.length; i++) {
                    images[i].style.maxWidth = '100%';
                    images[i].style.height = 'auto';
                    images[i].style.borderRadius = '8px';
                    images[i].style.margin = '15px 0';
                }
            };
            
            reader.readAsDataURL(file); 
            inputElement.value = ''; // 다음 업로드를 위해 초기화
        }

        // --- 기존 데이터 불러오기 (수정 페이지 전용) ---
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            alert('잘못된 접근입니다.');
            history.back();
        }

        async function loadPost() {
            try {
                const response = await fetch(`/api/posts?id=${postId}`);
                const post = await response.json();

                if(post) {
                    document.getElementById('title').value = post.title || '';
                    document.getElementById('slug').value = post.slug || '';
                    document.getElementById('category').value = post.category || '';
                    document.getElementById('editor').innerHTML = post.content || '';
                    document.getElementById('is_published').checked = (post.is_published === 1);
                }
            } catch (error) {
                console.error(error);
                alert('데이터를 불러오는데 실패했습니다.');
            }
        }

        loadPost();

        // --- 수정 데이터 저장 API 호출 (PUT) ---
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const slugValue = document.getElementById('slug').value;
            
            const data = {
                id: postId,
                title: title,
                slug: slugValue ? slugValue : title.replace(/\s+/g, '-'),
                category: document.getElementById('category').value,
                content: document.getElementById('editor').innerHTML,
                is_published: document.getElementById('is_published').checked
            };

            try {
                const response = await fetch('/api/posts', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    alert("성공적으로 수정되었습니다.");
                    window.location.href = "index.html"; 
                } else {
                    alert("수정 실패: " + result.error);
                }
            } catch (error) {
                alert("통신 오류가 발생했습니다: " + error.message);
            }
        });
    </script>
</body>
</html>
