<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 로그인 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#B69A7B',
                            dark: '#333333',
                            graytext: '#666666',
                            ivory: '#F9F7F3',
                            lightBorder: '#EFEFEF'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Nanum Myeongjo"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F9F7F3; }
        .font-serif { font-family: 'Nanum Myeongjo', serif; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-brand-gold selection:text-white">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-100 p-8 sm:p-10">
        
        <!-- 로고 및 헤더 -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 border border-brand-gold mx-auto flex flex-col items-center justify-center p-1 text-brand-gold font-serif leading-none text-[10px] text-center mb-5">
                <div>安漢</div><div>浚醫</div><div>哲院</div>
            </div>
            <h1 class="text-2xl font-serif font-bold text-gray-900 mb-2">관리자 로그인</h1>
            <p class="text-sm text-gray-500">안준석 한의원 통합 관리 시스템</p>
        </div>

        <!-- 로그인 폼 -->
        <form onsubmit="handleLogin(event)" class="space-y-6">
            
            <div>
                <label for="admin_id" class="block text-sm font-medium text-gray-700 mb-2">아이디</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-user text-gray-400 text-sm"></i>
                    </div>
                    <input type="text" id="admin_id" required class="block w-full pl-11 pr-4 py-3.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-brand-gold focus:border-brand-gold transition-colors bg-gray-50 focus:bg-white" placeholder="관리자 아이디를 입력하세요">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-2">비밀번호</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i class="fa-solid fa-lock text-gray-400 text-sm"></i>
                    </div>
                    <input type="password" id="password" required class="block w-full pl-11 pr-4 py-3.5 border border-gray-300 rounded-xl text-sm focus:outline-none focus:ring-1 focus:ring-brand-gold focus:border-brand-gold transition-colors bg-gray-50 focus:bg-white" placeholder="비밀번호를 입력하세요">
                </div>
            </div>

            <div class="flex items-center justify-between pt-2">
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 text-brand-gold focus:ring-brand-gold border-gray-300 rounded accent-brand-gold cursor-pointer">
                    <label for="remember-me" class="ml-2 block text-sm text-gray-600 cursor-pointer">아이디 저장</label>
                </div>
                <a href="/" class="text-sm font-medium text-gray-400 hover:text-brand-gold transition-colors"><i class="fa-solid fa-house mr-1"></i> 홈으로</a>
            </div>

            <button type="submit" class="w-full bg-brand-gold hover:bg-[#9A7D5E] text-white font-bold py-4 px-4 rounded-xl transition-all duration-200 focus:outline-none shadow-md hover:shadow-lg mt-4">
                로그인
            </button>
        </form>

        <div class="mt-8 text-center">
            <p class="text-xs text-gray-400">&copy; 2026 Ahn Junseok Oriental Clinic.</p>
        </div>

    </div>

    <!-- 로그인 처리 자바스크립트 -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // 폼 제출 새로고침 방지
            
            const idInput = document.getElementById('admin_id').value;
            const pwInput = document.getElementById('password').value;

            // 설정하신 아이디와 비밀번호 확인
            if (idInput === 'admin' && pwInput === 'tkdtmd1!') {
                // 브라우저에 임시 로그인 상태 저장 (창을 닫으면 초기화됨)
                sessionStorage.setItem('isAdminLoggedIn', 'true');
                // 대시보드로 이동
                window.location.href = '/admin/posts/';
            } else {
                alert('아이디 또는 비밀번호가 일치하지 않습니다. 다시 확인해 주세요.');
                document.getElementById('password').value = ''; // 비밀번호 칸 비우기
            }
        }
    </script>
</body>
</html>
