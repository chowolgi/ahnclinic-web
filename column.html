<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강 칼럼 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#B69A7B',
                            dark: '#333333',
                            graytext: '#666666',
                            ivory: '#F9F7F3',
                            lightBorder: '#EFEFEF'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Nanum Myeongjo"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F9F7F3; overflow-x: hidden; color: #333; }
        .font-serif { font-family: 'Nanum Myeongjo', serif; }
        .word-keep { word-break: keep-all; }
        .mega-menu-panel { transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s; }
        .sub-link { transition: all 0.2s ease; }
        .sub-link:hover { color: #B69A7B; font-weight: 500; transform: translateY(-2px); }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="antialiased selection:bg-brand-gold selection:text-white">

    <!-- HEADER & MEGA MENU -->
    <div id="header-wrapper" class="fixed top-0 left-0 w-full z-50 group bg-white border-b border-brand-lightBorder shadow-sm">
        <header class="relative z-20 h-24 flex items-center justify-between px-6 xl:px-12 max-w-screen-2xl mx-auto">
            <a href="index.html" class="flex items-center gap-3 shrink-0 cursor-pointer">
                <div class="w-10 h-10 border border-brand-gold flex flex-col items-center justify-center p-1 text-brand-gold font-serif leading-none text-[10px] text-center shrink-0">
                    <div>安漢</div><div>浚醫</div><div>哲院</div>
                </div>
                <div class="flex flex-col justify-center">
                    <span class="text-brand-dark text-2xl font-serif font-bold tracking-widest">안준석 한의원</span>
                    <span class="text-[10px] text-brand-gold tracking-wide mt-0.5">Ahn Junseok Oriental Clinic</span>
                </div>
            </a>
            
            <nav class="hidden lg:block w-[880px] xl:w-[1050px] mx-auto absolute left-1/2 -translate-x-1/2 h-full">
                <ul class="grid grid-cols-8 h-full text-center">
                    <li class="h-full flex items-center justify-center"><a href="2.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">한의원 소개</a></li>
                    <li class="h-full flex items-center justify-center"><a href="3.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">목·허리 디스크</a></li>
                    <li class="h-full flex items-center justify-center"><a href="4.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">이명/난청</a></li>
                    <li class="h-full flex items-center justify-center"><a href="5.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">여성/다이어트</a></li>
                    <li class="h-full flex items-center justify-center"><a href="6.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors word-keep">교통사고후유증</a></li>
                    <li class="h-full flex items-center justify-center"><a href="7.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">맞춤한약</a></li>
                    <li class="h-full flex items-center justify-center"><a href="notice.html" class="text-brand-dark hover:text-brand-gold text-[15px] font-medium w-full h-full flex items-center justify-center transition-colors">공지사항</a></li>
                    <li class="h-full flex items-center justify-center"><a href="column.html" class="text-brand-gold text-[15px] font-bold w-full h-full flex items-center justify-center transition-colors border-b-2 border-brand-gold">칼럼</a></li>
                </ul>
            </nav>
        </header>
    </div>

    <!-- MAIN CONTENT -->
    <main class="pt-24 min-h-[70vh]">
        <section class="py-16 bg-white text-center border-b border-gray-100">
            <h1 class="text-3xl md:text-4xl font-serif font-bold text-brand-dark mb-3">건강 칼럼</h1>
            <p class="text-brand-graytext text-sm">안준석 원장이 전해드리는 유익한 한방 건강 칼럼입니다.</p>
        </section>

        <section class="py-16 max-w-6xl mx-auto px-6">
            <div id="column-list" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
                <!-- 로딩 중 표시 -->
                <div class="col-span-1 md:col-span-2 lg:col-span-3 text-center text-gray-400 py-12">
                    <i class="fa-solid fa-spinner fa-spin mr-2"></i>칼럼을 불러오는 중입니다...
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-brand-dark text-gray-400 py-16 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-6 text-center text-sm">
            <p>&copy; 2026 Ahn Junseok Oriental Clinic. All rights reserved.</p>
        </div>
    </footer>

    <!-- 서버 연동 스크립트 -->
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const listContainer = document.getElementById('column-list');

            try {
                const response = await fetch('/api/posts');
                const posts = await response.json();
                const publishedPosts = posts.filter(post => post.is_published === 1);

                if (!publishedPosts || publishedPosts.length === 0) {
                    listContainer.innerHTML = `<div class="col-span-1 md:col-span-2 lg:col-span-3 text-center text-gray-500 py-12 bg-white rounded-2xl">등록된 건강 칼럼이 없습니다.</div>`;
                    return;
                }

                listContainer.innerHTML = '';

                const categoryMap = {
                    'spine': '척추/관절',
                    'tinnitus': '이명/난청',
                    'diet': '여성/다이어트',
                    'traffic': '교통사고'
                };

                publishedPosts.forEach(post => {
                    const catName = categoryMap[post.category] || '건강칼럼';
                    const date = new Date(post.created_at).toLocaleDateString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\.\s/g, '.').replace(/\.$/, '');

                    // 가상의 div를 만들어 HTML 본문 분석
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = post.content;
                    
                    // 1. 본문에서 첫 번째 이미지(img) 태그 찾아내기
                    const firstImg = tempDiv.querySelector('img');
                    // 이미지가 있으면 그 사진을, 없으면 브랜드 컬러가 들어간 기본 배경 이미지 사용
                    const imgSrc = firstImg ? firstImg.src : 'https://placehold.co/600x400/F9F7F3/B69A7B?text=Ahn+Clinic';

                    // 2. 본문에서 텍스트만 뽑아서 미리보기 요약문 만들기
                    const textContent = tempDiv.textContent || tempDiv.innerText || "";
                    const preview = textContent.length > 80 ? textContent.substring(0, 80) + '...' : textContent;

                    // 카드 생성
                    const card = document.createElement('a');
                    card.href = `column-view.html?id=${post.id}`;
                    card.className = "group bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-lg transition-all duration-300 block overflow-hidden flex flex-col h-full";
                    
                    card.innerHTML = `
                        <div class="relative w-full h-56 bg-brand-ivory overflow-hidden shrink-0">
                            <img src="${imgSrc}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" alt="칼럼 썸네일">
                            <span class="absolute top-4 left-4 bg-brand-gold text-white text-xs font-bold px-3 py-1.5 rounded shadow-sm z-10">${catName}</span>
                        </div>
                        <div class="p-6 md:p-8 flex flex-col flex-1">
                            <h3 class="text-xl font-bold text-brand-dark mb-3 line-clamp-2 group-hover:text-brand-gold transition-colors">${post.title}</h3>
                            <p class="text-brand-graytext text-sm leading-relaxed mb-6 line-clamp-2 flex-1">${preview}</p>
                            <div class="mt-auto pt-4 border-t border-gray-100 flex items-center justify-between">
                                <span class="text-xs text-gray-400">${date}</span>
                                <span class="text-xs text-brand-gold font-bold group-hover:underline">자세히 보기 <i class="fa-solid fa-arrow-right ml-1"></i></span>
                            </div>
                        </div>
                    `;
                    
                    listContainer.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                listContainer.innerHTML = `<div class="col-span-1 md:col-span-2 lg:col-span-3 text-center text-red-500 py-12">칼럼 목록을 불러오는 중 오류가 발생했습니다.</div>`;
            }
        });
    </script>
</body>
</html>
