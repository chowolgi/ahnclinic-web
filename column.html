<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>건강칼럼 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#B69A7B',      
                            dark: '#333333',      
                            graytext: '#666666',  
                            ivory: '#F9F7F3',     
                            lightBorder: '#EFEFEF'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Nanum Myeongjo"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; scroll-padding-top: 150px; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #F9F7F3; overflow-x: hidden; color: #333; }
        .font-serif { font-family: 'Nanum Myeongjo', serif; }
        .word-keep { word-break: keep-all; }
        
        .gnb-link { position: relative; padding-bottom: 5px; }
        .gnb-link::after {
            content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px;
            background-color: transparent; transition: background-color 0.3s;
        }
        .gnb-link:hover::after, .gnb-link.active::after { background-color: #B69A7B; }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        
        /* 칼럼 카드 호버 효과 */
        .column-card { transition: all 0.3s ease; }
        .column-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.06); border-color: #B69A7B; }
        .column-card img { transition: transform 0.5s ease; }
        .column-card:hover img { transform: scale(1.05); }
    </style>
</head>
<body class="antialiased selection:bg-brand-gold selection:text-white">

    <!-- HEADER -->
    <div class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-md border-b border-brand-lightBorder shadow-sm transition-all duration-300">
        <header class="relative z-20 h-24 flex items-center justify-between px-4 xl:px-12 max-w-screen-2xl mx-auto">
            <a href="index.html" class="flex items-center gap-3 shrink-0 cursor-pointer">
                <div class="w-10 h-10 border border-brand-gold flex flex-col items-center justify-center p-1 text-brand-gold font-serif leading-none text-[10px] text-center shrink-0">
                    <div>安漢</div><div>浚醫</div><div>哲院</div>
                </div>
                <div class="flex flex-col justify-center">
                    <span class="text-brand-dark text-xl xl:text-2xl font-serif font-bold tracking-widest">안준석 한의원</span>
                    <span class="text-[9px] xl:text-[10px] text-brand-gold tracking-wide mt-0.5 uppercase">Ahn Junseok Oriental Clinic</span>
                </div>
            </a>
            
            <nav class="hidden lg:flex flex-1 justify-center h-full">
                <ul class="flex items-center gap-12 h-full text-[15px] font-medium text-brand-dark">
                    <li class="h-full flex items-center"><a href="3.html" class="gnb-link hover:text-brand-gold transition-colors">목·허리 디스크</a></li>
                    <li class="h-full flex items-center"><a href="4.html" class="gnb-link hover:text-brand-gold transition-colors">이명/난청</a></li>
                    <li class="h-full flex items-center"><a href="5.html" class="gnb-link hover:text-brand-gold transition-colors">여성/다이어트</a></li>
                    <li class="h-full flex items-center"><a href="6.html" class="gnb-link hover:text-brand-gold transition-colors">교통사고후유증</a></li>
                    <li class="h-full flex items-center"><a href="7.html" class="gnb-link hover:text-brand-gold transition-colors">맞춤한약</a></li>
                </ul>
            </nav>

            <div class="flex items-center shrink-0 lg:hidden">
                <button class="w-10 h-10 rounded-full bg-brand-ivory text-brand-dark hover:bg-brand-gold hover:text-white flex items-center justify-center transition-colors shadow-sm">
                    <i class="fas fa-bars text-lg"></i>
                </button>
            </div>
            <div class="hidden lg:block w-[180px] shrink-0"></div>
        </header>
    </div>

    <!-- FLOATING RIGHT MENU -->
    <div class="fixed right-4 md:right-6 top-1/2 -translate-y-1/2 z-40 bg-white/90 backdrop-blur-md rounded-full shadow-lg border border-gray-100 p-2 flex flex-col gap-2">
        <a href="https://booking.naver.com/" target="_blank" class="w-12 h-12 md:w-14 md:h-14 rounded-full hover:bg-brand-ivory flex flex-col items-center justify-center transition-colors group">
            <div class="w-5 h-5 md:w-6 md:h-6 bg-brand-gold text-white rounded-full font-bold text-[10px] md:text-[11px] flex items-center justify-center mb-1 group-hover:scale-110 transition-transform"><i class="fas fa-calendar-check"></i></div>
            <span class="text-[9px] md:text-[10px] text-gray-600 font-medium">예약</span>
        </a>
        <div class="w-8 h-px bg-gray-200 mx-auto my-1"></div>
        <a href="column.html" class="w-12 h-12 md:w-14 md:h-14 rounded-full hover:bg-brand-ivory flex flex-col items-center justify-center transition-colors group">
            <div class="w-5 h-5 md:w-6 md:h-6 bg-brand-dark text-white rounded-full font-bold text-[10px] md:text-[11px] flex items-center justify-center mb-1 group-hover:scale-110 transition-transform"><i class="fa-solid fa-pen-nib"></i></div>
            <span class="text-[9px] md:text-[10px] text-gray-600 font-medium">칼럼</span>
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <main class="pt-24 min-h-screen flex flex-col">
        <!-- 메인 배너 -->
        <section class="relative h-[300px] w-full flex items-center justify-center bg-brand-ivory overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1455390582262-044cdead27d8?auto=format&fit=crop&w=1920&q=80')] bg-cover bg-center opacity-40 mix-blend-multiply"></div>
            <div class="absolute inset-0 bg-gradient-to-t from-brand-dark/90 to-transparent"></div>
            <div class="relative z-10 text-center text-white px-6 mt-10">
                <span class="text-brand-gold font-bold tracking-widest text-sm mb-3 block uppercase drop-shadow-md">Health Column</span>
                <h1 class="text-4xl md:text-5xl font-serif font-bold mb-3 drop-shadow-lg">건강 칼럼</h1>
                <p class="text-gray-300 font-light text-base tracking-wide">안준석 원장이 전하는 올바른 한의학 이야기</p>
            </div>
        </section>

        <!-- 칼럼 리스트 영역 -->
        <section class="py-20 flex-grow">
            <div class="max-w-7xl mx-auto px-6">
                <!-- 카테고리 필터 (기존 디자인 유지) -->
                <div class="flex flex-wrap justify-center gap-4 mb-16 reveal">
                    <button class="px-6 py-2 rounded-full border border-brand-gold bg-brand-gold text-white text-sm font-medium transition">전체보기</button>
                    <button class="px-6 py-2 rounded-full border border-brand-lightBorder bg-white text-brand-graytext hover:border-brand-gold hover:text-brand-gold text-sm font-medium transition">통증/척추</button>
                    <button class="px-6 py-2 rounded-full border border-brand-lightBorder bg-white text-brand-graytext hover:border-brand-gold hover:text-brand-gold text-sm font-medium transition">이명/난청</button>
                    <button class="px-6 py-2 rounded-full border border-brand-lightBorder bg-white text-brand-graytext hover:border-brand-gold hover:text-brand-gold text-sm font-medium transition">보약/다이어트</button>
                </div>

                <!-- 💥 API 데이터를 불러와서 채워넣을 빈 그리드 리스트 💥 -->
                <div id="column-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    <!-- 자바스크립트가 여기에 칼럼을 자동으로 그려줍니다 -->
                </div>

                <!-- 페이지네이션 -->
                <div class="flex justify-center items-center gap-2 mt-16 reveal">
                    <button class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-400 hover:border-brand-gold hover:text-brand-gold transition"><i class="fa-solid fa-angle-left"></i></button>
                    <button class="w-10 h-10 rounded-full flex items-center justify-center bg-brand-dark text-white font-medium">1</button>
                    <button class="w-10 h-10 rounded-full flex items-center justify-center border border-gray-200 text-gray-400 hover:border-brand-gold hover:text-brand-gold transition"><i class="fa-solid fa-angle-right"></i></button>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="bg-brand-dark text-gray-400 pt-16 pb-8 border-t border-gray-800">
        <div class="max-w-7xl mx-auto px-6 text-center text-xs text-gray-500 font-light">
            <p>&copy; 2026 Ahn Junseok Oriental Medical Clinic. All rights reserved.</p>
        </div>
    </footer>

    <!-- 💥 API 연동 자바스크립트 💥 -->
    <script>
        // 1. 관리자 페이지에서 쓴 글 목록을 불러옵니다
        async function loadColumns() {
            try {
                const response = await fetch('/api/posts'); // Cloudflare DB 호출
                if (!response.ok) throw new Error('게시글을 불러오는데 실패했습니다.');
                
                const posts = await response.json();
                const grid = document.getElementById('column-grid');
                grid.innerHTML = ''; // 화면 초기화

                // 2. 불러온 글이 없으면 안내 문구 표시
                if (!posts || posts.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-gray-400 py-10">등록된 칼럼이 없습니다.</p>';
                    return;
                }

                // 3. 불러온 글을 새 디자인 카드 모양으로 렌더링
                posts.forEach((post, index) => {
                    const delay = (index % 3) * 100; // 카드 등장 애니메이션 효과
                    
                    // 제목, 날짜, 내용 등 데이터 매핑
                    const postDate = post.created_at ? new Date(post.created_at).toLocaleDateString('ko-KR') : '최신 글';
                    const postCategory = post.category || '건강칼럼';
                    const postTitle = post.title || '제목 없음';
                    
                    // 내용에서 HTML 태그를 제거하고 순수 텍스트만 요약해서 보여줌
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = post.content || '';
                    const plainText = tempDiv.textContent || tempDiv.innerText || '';
                    const postExcerpt = plainText.substring(0, 80) + '...';

                    // 이미지가 없으면 기본 한의원 이미지 사용
                    const postImage = post.image_url || 'https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80';
                    const postLink = `column-view.html?id=${post.id}`;

                    const cardHtml = `
                        <a href="${postLink}" class="column-card block bg-white rounded-xl border border-brand-lightBorder overflow-hidden reveal active" style="transition-delay: ${delay}ms;">
                            <div class="w-full h-56 overflow-hidden bg-gray-100">
                                <img src="${postImage}" alt="${postTitle}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-6 md:p-8">
                                <div class="flex items-center justify-between mb-3">
                                    <span class="text-xs font-bold text-brand-gold bg-brand-ivory px-3 py-1 rounded-full">${postCategory}</span>
                                    <span class="text-xs text-gray-400 font-light">${postDate}</span>
                                </div>
                                <h3 class="text-xl font-bold text-brand-dark mb-3 leading-snug word-keep">${postTitle}</h3>
                                <p class="text-brand-graytext text-sm leading-relaxed mb-5 line-clamp-3">
                                    ${postExcerpt}
                                </p>
                                <span class="text-sm font-bold text-brand-dark flex items-center gap-2 group">
                                    자세히 보기 <i class="fa-solid fa-arrow-right text-brand-gold text-xs transition-transform group-hover:translate-x-1"></i>
                                </span>
                            </div>
                        </a>
                    `;
                    grid.insertAdjacentHTML('beforeend', cardHtml);
                });

            } catch (error) {
                console.error('Error loading columns:', error);
                document.getElementById('column-grid').innerHTML = '<p class="col-span-full text-center text-red-400 py-10">칼럼을 불러오는 중 오류가 발생했습니다.</p>';
            }
        }

        // 스크롤 시 나타나는 애니메이션 설정 및 데이터 로드 실행
        document.addEventListener("DOMContentLoaded", function() {
            loadColumns(); // 화면이 열리면 위에서 만든 함수 실행!

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                        observer.unobserve(entry.target);
                    }
                });
            }, { rootMargin: '0px', threshold: 0.15 });
            
            setTimeout(() => {
                document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
            }, 500);
        });
    </script>
</body>
</html>
