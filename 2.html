<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한의원 소개 - 안준석 한의원</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            gold: '#B69A7B',      /* 우아한 샴페인 골드 */
                            dark: '#333333',      /* 텍스트용 다크 그레이 */
                            graytext: '#666666',  /* 본문 서브 텍스트 */
                            ivory: '#F9F7F3',     /* 따뜻한 아이보리 배경 */
                            lightBorder: '#EFEFEF'
                        }
                    },
                    fontFamily: {
                        sans: ['"Noto Sans KR"', 'sans-serif'],
                        serif: ['"Nanum Myeongjo"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        html { scroll-behavior: smooth; scroll-padding-top: 150px; }
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #ffffff; overflow-x: hidden; color: #333; }
        .font-serif { font-family: 'Nanum Myeongjo', serif; }
        .word-keep { word-break: keep-all; }
        
        /* GNB 드롭다운 및 메뉴 스타일 */
        .gnb-link {
            position: relative;
            padding-bottom: 5px;
        }
        .gnb-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: transparent;
            transition: background-color 0.3s;
        }
        .gnb-link:hover::after, .gnb-link.active::after {
            background-color: #B69A7B;
        }
        
        .dropdown {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06);
            border: 1px solid #EBE7D9;
            border-radius: 8px;
            width: max-content;
            min-width: 140px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item:hover .dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        .dropdown a {
            padding: 12px 20px;
            font-size: 14px;
            color: #666;
            font-weight: 400;
            transition: all 0.2s;
            display: block;
            text-align: center;
        }

        .dropdown a:hover {
            background-color: #FDFCF0;
            color: #B69A7B;
            font-weight: 500;
        }

        .nav-reserve-btn {
            background-color: #2c2c2c;
            color: #fff !important;
            padding: 12px 28px !important;
            border-radius: 30px;
            font-size: 15px !important;
            font-weight: 500 !important;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .nav-reserve-btn:hover {
            background-color: #B69A7B;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(182, 154, 123, 0.3);
        }

        /* 서브페이지 내부 목차 (Sticky Subnav) */
        .sticky-subnav {
            position: sticky;
            top: 96px;
            z-index: 40;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid #EFEFEF;
        }
        .sticky-subnav a { position: relative; }
        .sticky-subnav a::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: transparent;
            transition: background-color 0.3s;
        }
        .sticky-subnav a:hover::after,
        .sticky-subnav a.active::after { background-color: #B69A7B; }
        .sticky-subnav a:hover,
        .sticky-subnav a.active { color: #B69A7B; }

        .reveal { opacity: 0; transform: translateY(40px); transition: all 0.8s cubic-bezier(0.5, 0, 0, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .delay-100 { transition-delay: 100ms; }
        .delay-200 { transition-delay: 200ms; }
    </style>
</head>
